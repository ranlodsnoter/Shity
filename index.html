<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Memo — Minimalist DSP Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        studio: {
                            bg: '#FFFFFF',
                            surface: '#F8F9FA',
                            border: '#E5E5E7',
                            ink: '#111111',
                            muted: '#71717A',
                            rec: '#EF4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Strict Minimalist White Hardware Aesthetic */
        body {
            background-color: #FFFFFF;
            color: #111111;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }

        /* Hairline Custom Range Slider */
        input[type="range"].min-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 28px;
            background: transparent;
            cursor: pointer;
            touch-action: pan-y;
        }

        input[type="range"].min-slider:focus {
            outline: none;
        }

        /* Track: crisp 2px hairline */
        input[type="range"].min-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #E5E5E7;
            border-radius: 999px;
        }

        input[type="range"].min-slider::-moz-range-track {
            width: 100%;
            height: 2px;
            background: #E5E5E7;
            border-radius: 999px;
        }

        /* Thumb: crisp circular white puck with 1.5px solid black border */
        input[type="range"].min-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 1.5px solid #111111;
            margin-top: -7px;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        input[type="range"].min-slider::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 1.5px solid #111111;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        input[type="range"].min-slider:active::-webkit-slider-thumb {
            background: #111111;
            transform: scale(1.12);
        }

        input[type="range"].min-slider:active::-moz-range-thumb {
            background: #111111;
            transform: scale(1.12);
        }

        /* Minimal Scrubber */
        input[type="range"].scrubber-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 20px;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"].scrubber-slider::-webkit-slider-runnable-track {
            height: 2px;
            background: #E5E5E7;
            border-radius: 999px;
        }

        input[type="range"].scrubber-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background: #111111;
            margin-top: -4px;
        }

        input[type="range"].scrubber-slider:disabled::-webkit-slider-thumb {
            background: #D4D4D8;
        }

        /* Hide horizontal scrollbar on presets */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes rec-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .animate-rec-dot {
            animation: rec-pulse 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen bg-white text-studio-ink antialiased flex flex-col items-center justify-start px-4 py-6 sm:py-10 select-none">

    <!-- Strict Single-Column Minimalist Container (max-width 480px) -->
    <main class="w-full max-w-[480px] flex flex-col space-y-6">

        <!-- Minimal Top Header -->
        <header class="flex items-center justify-between pb-3 border-b border-studio-border">
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold tracking-tight text-studio-ink">Voice Memo</span>
                <span class="text-[11px] font-mono text-studio-muted">DSP</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-studio-border"></span>
                <span id="statusText" class="text-[11px] font-mono uppercase tracking-wider text-studio-muted">Ready</span>
            </div>
        </header>

        <!-- Minimal Inline Notice Banner (replaces alert()) -->
        <div id="toastBanner" class="hidden px-3.5 py-2.5 rounded-xl bg-studio-surface border border-studio-border text-xs text-studio-ink flex items-center justify-between gap-2">
            <span id="toastMessage" class="leading-snug flex-1">Notice</span>
            <div class="flex items-center gap-1 shrink-0">
                <button id="toastRetryBtn" class="hidden px-2.5 py-1 rounded-full bg-studio-ink text-white text-[11px] font-medium hover:bg-black/85 transition-colors">
                    Try Again
                </button>
                <button id="toastClose" class="text-studio-muted hover:text-studio-ink p-1" aria-label="Dismiss">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>

        <!-- Waveform Visualizer & Timecode Display -->
        <section class="bg-studio-surface border border-studio-border rounded-2xl p-4 sm:p-5 flex flex-col">
            <div class="flex items-center justify-between mb-3">
                <span id="trackSourceLabel" class="text-[11px] font-medium text-studio-muted truncate max-w-[65%]">No recording</span>
                <span id="timerDisplay" class="font-mono text-sm font-medium text-studio-ink tabular">00:00.0</span>
            </div>

            <!-- Thin-Line Oscilloscope / Waveform Canvas -->
            <div class="w-full h-24 relative bg-white rounded-xl border border-studio-border overflow-hidden">
                <canvas id="visualizerCanvas" class="w-full h-full block"></canvas>
                <div id="canvasOverlayPrompt" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="text-xs text-studio-muted">Tap record to capture voice</span>
                </div>
            </div>

            <!-- Scrubber Timeline -->
            <div class="mt-3 flex items-center gap-3">
                <span id="currentTimeText" class="font-mono text-[11px] text-studio-muted tabular w-9">00:00</span>
                <input type="range" id="scrubber" class="scrubber-slider flex-1" min="0" max="100" step="0.1" value="0" disabled>
                <span id="totalTimeText" class="font-mono text-[11px] text-studio-muted tabular w-9 text-right">00:00</span>
            </div>

            <!-- Primary Circular Record & Transport Row -->
            <div class="mt-5 flex items-center justify-between">
                <!-- Left: Play / Pause -->
                <button id="playBtn" disabled class="h-11 px-4 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink disabled:opacity-35 disabled:pointer-events-none flex items-center justify-center gap-2 text-xs font-medium transition-colors">
                    <i id="playIcon" data-lucide="play" class="w-3.5 h-3.5"></i>
                    <span id="playBtnText">Play</span>
                </button>

                <!-- Center: Prominent Circular Record Button -->
                <button id="recordBtn" aria-label="Record Microphone" class="w-16 h-16 rounded-full border border-studio-border bg-white hover:border-studio-ink flex items-center justify-center transition-all active:scale-95">
                    <span id="recIconShape" class="w-6 h-6 rounded-full bg-studio-rec transition-all duration-150"></span>
                </button>

                <!-- Right: Loop Toggle -->
                <button id="loopBtn" class="h-11 px-4 rounded-full border border-studio-border bg-white text-studio-muted hover:text-studio-ink hover:border-studio-ink flex items-center justify-center gap-1.5 text-xs font-medium transition-colors">
                    <i id="loopIcon" data-lucide="repeat" class="w-3.5 h-3.5"></i>
                    <span id="loopText">Loop</span>
                </button>
            </div>

            <!-- Subtle Secondary Source Links -->
            <div class="mt-4 pt-3 border-t border-studio-border flex items-center justify-center gap-4 text-xs text-studio-muted">
                <label class="hover:text-studio-ink cursor-pointer transition-colors underline underline-offset-4 decoration-studio-border hover:decoration-studio-ink">
                    Upload audio / video
                    <input type="file" id="audioUploadInput" accept="audio/*,video/*,.mov,.MOV,.mp4,.MP4,.m4v,.M4V,.webm,.mkv,.avi,.3gp,.wav,.mp3,.m4a,.aac,.ogg,.flac" class="hidden">
                </label>
                <span class="text-studio-border">•</span>
                <button id="synthTestBtn" class="hover:text-studio-ink transition-colors underline underline-offset-4 decoration-studio-border hover:decoration-studio-ink">
                    Load test clip
                </button>
            </div>

            <!-- Structured Upload Diagnostic Card (Shown on Video/Audio Decode Failure) -->
            <div id="uploadDiagCard" class="hidden mt-3.5 p-3.5 rounded-xl bg-white border border-studio-border text-left space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-studio-rec shrink-0"></span>
                        <span id="diagTitle" class="text-xs font-semibold text-studio-ink">Upload Failed</span>
                    </div>
                    <button id="diagCloseBtn" class="text-studio-muted hover:text-studio-ink p-0.5 -mr-1 -mt-0.5" aria-label="Close diagnostic">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <!-- Detected File Metadata -->
                <div id="diagFileMeta" class="px-2.5 py-2 rounded-lg bg-studio-surface border border-studio-border font-mono text-[10px] text-studio-muted leading-relaxed break-all">
                    File: —
                </div>

                <!-- Exact Failure Reason -->
                <p id="diagReason" class="text-xs text-studio-ink leading-relaxed">
                    Reason details will appear here.
                </p>

                <!-- Actionable Quick Fix Tip -->
                <div class="pt-2 border-t border-studio-border flex items-start gap-2">
                    <span class="text-[10px] font-mono uppercase tracking-wider text-studio-muted shrink-0 mt-0.5">Fix</span>
                    <p id="diagTip" class="text-[11px] text-studio-muted leading-snug">
                        Tip details will appear here.
                    </p>
                </div>
            </div>
        </section>

        <!-- Horizontal Pill Row of Quick Presets -->
        <section>
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                <button data-preset="clean" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-ink bg-studio-ink text-white text-xs font-medium transition-colors">Clean</button>
                <button data-preset="dorm" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink text-xs font-medium transition-colors">Dorm Over</button>
                <button data-preset="lofi" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink text-xs font-medium transition-colors">Lo-Fi Radio</button>
                <button data-preset="bass" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink text-xs font-medium transition-colors">Demon Bass</button>
                <button data-preset="retro8bit" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink text-xs font-medium transition-colors">8-Bit Retro</button>
                <button data-preset="space" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink text-xs font-medium transition-colors">Cathedral</button>
                <button data-preset="onekhz" class="preset-btn shrink-0 px-3.5 py-1.5 rounded-full border border-studio-border bg-white text-studio-ink hover:border-studio-ink text-xs font-medium transition-colors">1kHz Crush</button>
            </div>
        </section>

        <!-- Clean Stacked Effect Sliders -->
        <section class="divide-y divide-studio-border border-y border-studio-border">

            <!-- 1. Output Volume (0% to 200%) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="volumeSlider" class="text-xs font-medium text-studio-ink">Output Volume</label>
                    <span id="volumeVal" class="font-mono text-xs text-studio-muted tabular">100%</span>
                </div>
                <input type="range" id="volumeSlider" class="min-slider" min="0" max="200" step="1" value="100">
            </div>

            <!-- 2. Heard from a dorm over (0% to 100%) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="dormSlider" class="text-xs font-medium text-studio-ink">Heard from a dorm over</label>
                    <span id="dormVal" class="font-mono text-xs text-studio-muted tabular">0%</span>
                </div>
                <input type="range" id="dormSlider" class="min-slider" min="0" max="100" step="1" value="0">
            </div>

            <!-- 3. Sample Rate (48.0 kHz down to 1.0 kHz) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="volumeSlider" class="text-xs font-medium text-studio-ink">Output Volume</label>
                    <span id="volumeVal" class="font-mono text-xs text-studio-muted tabular">100%</span>
                </div>
                <input type="range" id="volumeSlider" class="min-slider" min="0" max="200" step="1" value="100">
            </div>

            <!-- 2. Sample Rate (48.0 kHz down to 1.0 kHz) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="sampleRateSlider" class="text-xs font-medium text-studio-ink">Sample Rate</label>
                    <span id="sampleRateVal" class="font-mono text-xs text-studio-muted tabular">48.0 kHz</span>
                </div>
                <input type="range" id="sampleRateSlider" class="min-slider" min="1000" max="48000" step="100" value="48000">
            </div>

            <!-- 3. Bit Crusher (16 bit down to 1 bit) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="bitDepthSlider" class="text-xs font-medium text-studio-ink">Bit Crusher</label>
                    <span id="bitDepthVal" class="font-mono text-xs text-studio-muted tabular">16 bit</span>
                </div>
                <input type="range" id="bitDepthSlider" class="min-slider" min="1" max="16" step="1" value="16">
            </div>

            <!-- 4. Speed / Pitch (0.25x to 2.50x) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="speedSlider" class="text-xs font-medium text-studio-ink">Speed / Pitch</label>
                    <span id="speedVal" class="font-mono text-xs text-studio-muted tabular">1.00x</span>
                </div>
                <input type="range" id="speedSlider" class="min-slider" min="0.25" max="2.50" step="0.05" value="1.00">
            </div>

            <!-- 5. Bass Boost (0 dB to +24 dB) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="bassSlider" class="text-xs font-medium text-studio-ink">Bass Boost</label>
                    <span id="bassVal" class="font-mono text-xs text-studio-muted tabular">+0 dB</span>
                </div>
                <input type="range" id="bassSlider" class="min-slider" min="0" max="24" step="1" value="0">
            </div>

            <!-- 6. Distortion (0% to 100%) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="distortionSlider" class="text-xs font-medium text-studio-ink">Distortion</label>
                    <span id="distortionVal" class="font-mono text-xs text-studio-muted tabular">0%</span>
                </div>
                <input type="range" id="distortionSlider" class="min-slider" min="0" max="100" step="1" value="0">
            </div>

            <!-- 7. Reverb (0% to 100%) -->
            <div class="py-3.5">
                <div class="flex items-baseline justify-between mb-1">
                    <label for="reverbSlider" class="text-xs font-medium text-studio-ink">Reverb</label>
                    <span id="reverbVal" class="font-mono text-xs text-studio-muted tabular">0%</span>
                </div>
                <input type="range" id="reverbSlider" class="min-slider" min="0" max="100" step="1" value="0">
            </div>

        </section>

        <!-- Clean Bottom Bar: Reset & Export WAV -->
        <footer class="pt-1 pb-6 flex items-center justify-between gap-3">
            <button id="resetFxBtn" class="h-11 px-5 rounded-full border border-transparent hover:border-studio-border text-xs font-medium text-studio-muted hover:text-studio-ink transition-colors">
                Reset
            </button>
            <button id="exportBtn" disabled class="h-11 px-6 rounded-full bg-studio-ink text-white hover:bg-black/85 disabled:opacity-30 disabled:pointer-events-none text-xs font-medium flex items-center justify-center gap-2 transition-all active:scale-[0.99]">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span id="exportBtnText">Export WAV</span>
            </button>
        </footer>

    </main>

    <script>
        /**
         * Minimalist Voice Memo & DSP Studio
         * Web Audio API Recorder, Multi-Stage Video/Audio Demuxer, Real-Time Effects Chain, and Offline WAV Renderer
         */
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // --- Application State ---
            const state = {
                audioCtx: null,
                audioBuffer: null,
                sourceNode: null,
                mediaRecorder: null,
                mediaStream: null,
                micSourceNode: null,
                analyserNode: null,
                recordedChunks: [],
                isRecording: false,
                isPlaying: false,
                isLooping: false,
                recStartTime: 0,
                recTimerInterval: null,
                playOffset: 0,
                lastSpeedChangeTime: 0,
                accumulatedBufferPos: 0,
                animationFrameId: null,

                // Real-time DSP nodes
                nodes: {
                    bassFilter: null,
                    shaper: null,
                    dryGain: null,
                    wetGain: null,
                    convolver: null,
                    crusherNode: null,
                    dormWallFilter1: null,
                    dormWallFilter2: null,
                    dormWallResonance: null,
                    dormHallwayConvolver: null,
                    dormDirectGain: null,
                    dormHallwayGain: null,
                    dormSumGain: null,
                    dormStereoMerge: null,
                    dormStereoSplit: null,
                    dormDistanceGain: null,
                    volumeGain: null,
                    limiter: null
                },

                // DSP Parameters
                params: {
                    volume: 100,         // 0% to 200%
                    dorm: 0,             // 0% to 100% ("Heard from a dorm over")
                    sampleRate: 48000,   // 48000 Hz down to 1000 Hz
                    bitDepth: 16,        // 16 bit down to 1 bit
                    speed: 1.00,         // 0.25x to 2.50x
                    bassGain: 0,         // 0 dB to +24 dB
                    distortion: 0,       // 0 to 100
                    reverbMix: 0         // 0% to 100%
                }
            };
// ... existing code ... -->
                // Sliders & Readouts
                volumeSlider: document.getElementById('volumeSlider'),
                volumeVal: document.getElementById('volumeVal'),
                dormSlider: document.getElementById('dormSlider'),
                dormVal: document.getElementById('dormVal'),
                sampleRateSlider: document.getElementById('sampleRateSlider'),
                sampleRateVal: document.getElementById('sampleRateVal'),
                bitDepthSlider: document.getElementById('bitDepthSlider'),
                bitDepthVal: document.getElementById('bitDepthVal'),
                speedSlider: document.getElementById('speedSlider'),
                speedVal: document.getElementById('speedVal'),
                bassSlider: document.getElementById('bassSlider'),
                bassVal: document.getElementById('bassVal'),
                distortionSlider: document.getElementById('distortionSlider'),
                distortionVal: document.getElementById('distortionVal'),
                reverbSlider: document.getElementById('reverbSlider'),
                reverbVal: document.getElementById('reverbVal')
            };

            const canvasCtx = el.canvas.getContext('2d');

            // --- Utility & Diagnostics Functions ---
            function showToast(msg, showRetry = false) {
                el.toastMessage.textContent = msg;
                if (showRetry) {
                    el.toastRetryBtn.classList.remove('hidden');
                } else {
                    el.toastRetryBtn.classList.add('hidden');
                }
                el.toastBanner.classList.remove('hidden');
            }

            el.toastClose.addEventListener('click', () => {
                el.toastBanner.classList.add('hidden');
            });

            el.toastRetryBtn.addEventListener('click', () => {
                el.toastBanner.classList.add('hidden');
                startRecording();
            });

            el.diagCloseBtn.addEventListener('click', () => {
                el.uploadDiagCard.classList.add('hidden');
            });

            function showUploadDiagnostic({ title, fileMeta, reason, tip }) {
                el.diagTitle.textContent = title || 'Upload Failed';
                el.diagFileMeta.textContent = fileMeta || 'Unknown file';
                el.diagReason.textContent = reason;
                el.diagTip.textContent = tip;
                el.uploadDiagCard.classList.remove('hidden');
                lucide.createIcons();
            }

            function hideUploadDiagnostic() {
                el.uploadDiagCard.classList.add('hidden');
            }

            function formatBytes(bytes) {
                if (!bytes || bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return `${(bytes / Math.pow(k, i)).toFixed(1)} ${sizes[i]}`;
            }

            function formatVolumeLabel(pct) {
                if (pct === 0) return '0% (Muted)';
                if (pct > 100) {
                    const db = (20 * Math.log10(pct / 100)).toFixed(1);
                    return `${pct}% (+${db} dB)`;
                }
                return `${pct}%`;
            }

            function setStatus(mode, text) {
                el.statusText.textContent = text;
                el.statusDot.className = 'w-1.5 h-1.5 rounded-full ';
                if (mode === 'rec') {
                    el.statusDot.classList.add('bg-studio-rec', 'animate-rec-dot');
                    el.statusText.className = 'text-[11px] font-mono uppercase tracking-wider text-studio-rec font-medium';
                } else if (mode === 'play') {
                    el.statusDot.classList.add('bg-studio-ink');
                    el.statusText.className = 'text-[11px] font-mono uppercase tracking-wider text-studio-ink font-medium';
                } else if (mode === 'ready') {
                    el.statusDot.classList.add('bg-studio-ink');
                    el.statusText.className = 'text-[11px] font-mono uppercase tracking-wider text-studio-muted';
                } else {
                    el.statusDot.classList.add('bg-studio-border');
                    el.statusText.className = 'text-[11px] font-mono uppercase tracking-wider text-studio-muted';
                }
            }

            function formatTime(sec, includeTenths = false) {
                if (!isFinite(sec) || sec < 0) sec = 0;
                const mins = Math.floor(sec / 60);
                const secs = Math.floor(sec % 60);
                const tenths = Math.floor((sec % 1) * 10);
                const base = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                return includeTenths ? `${base}.${tenths}` : base;
            }

            function ensureAudioContext() {
                if (!state.audioCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    state.audioCtx = new AudioCtx();
                    setupPersistentNodes();
                }
                if (state.audioCtx.state === 'suspended') {
                    state.audioCtx.resume();
                }
                return state.audioCtx;
            }

            // --- Binary Header Signature Inspector ---
            async function inspectFileSignature(fileOrBlob) {
                const info = {
                    name: fileOrBlob.name || 'recorded_audio',
                    size: fileOrBlob.size || 0,
                    sizeFormatted: formatBytes(fileOrBlob.size || 0),
                    reportedMime: fileOrBlob.type || 'none',
                    container: 'Unknown Container',
                    brand: '',
                    isVideo: false,
                    isQuickTime: false,
                    isScreenRecording: /^RPReplay_/i.test(fileOrBlob.name || '') || /screen\s*recording/i.test(fileOrBlob.name || ''),
                    isEmpty: !fileOrBlob.size || fileOrBlob.size === 0
                };

                if (info.isEmpty) {
                    info.container = 'Empty / 0-Byte File';
                    return info;
                }

                try {
                    const headerSlice = fileOrBlob.slice(0, 64);
                    const buf = await headerSlice.arrayBuffer();
                    const bytes = new Uint8Array(buf);
                    const ascii = Array.from(bytes).map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join('');

                    // Check ISO Base Media File Format ('ftyp' at byte offset 4) -> MP4, MOV, M4A, M4V, 3GP, HEIC
                    if (bytes.length >= 12 && ascii.slice(4, 8) === 'ftyp') {
                        const majorBrand = ascii.slice(8, 12).trim();
                        info.brand = majorBrand;
                        if (majorBrand === 'qt') {
                            info.container = 'QuickTime .MOV (ftypqt)';
                            info.isVideo = true;
                            info.isQuickTime = true;
                        } else if (['mp41', 'mp42', 'isom', 'iso2', 'avc1', 'hvc1', 'hev1', 'M4V'].includes(majorBrand)) {
                            info.container = `MP4 Video (${majorBrand})`;
                            info.isVideo = true;
                        } else if (majorBrand === 'M4A') {
                            info.container = 'M4A Audio (ftypM4A)';
                        } else if (majorBrand.startsWith('3gp')) {
                            info.container = `3GP Media (${majorBrand})`;
                            info.isVideo = true;
                        } else {
                            info.container = `ISO Media (${majorBrand})`;
                            info.isVideo = /\.(mov|mp4|m4v|3gp)$/i.test(info.name);
                        }
                    } else if (ascii.startsWith('RIFF') && ascii.slice(8, 12) === 'WAVE') {
                        info.container = 'WAV Audio (RIFF/WAVE)';
                    } else if (ascii.startsWith('RIFF') && ascii.slice(8, 12) === 'AVI ') {
                        info.container = 'AVI Video (RIFF/AVI)';
                        info.isVideo = true;
                    } else if (ascii.startsWith('ID3') || (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0)) {
                        info.container = 'MP3 Audio';
                    } else if (ascii.startsWith('OggS')) {
                        info.container = 'OGG Media (OggS)';
                    } else if (ascii.startsWith('fLaC')) {
                        info.container = 'FLAC Audio (fLaC)';
                    } else if (bytes[0] === 0x1A && bytes[1] === 0x45 && bytes[2] === 0xDF && bytes[3] === 0xA3) {
                        info.container = 'WebM / Matroska (EBML)';
                        info.isVideo = true;
                    } else {
                        const ext = (info.name.split('.').pop() || '').toUpperCase();
                        info.container = ext ? `${ext} File (Unrecognized Header)` : 'Raw / Unknown Header';
                        info.isVideo = /\.(mov|mp4|m4v|webm|mkv|avi|3gp)$/i.test(info.name);
                    }
                } catch (e) {
                    info.container = 'Unreadable File Header';
                }

                return info;
            }

            // --- DSP Helper Algorithms ---
            function createImpulseResponse(ctx, duration = 2.4, decay = 3.0) {
                const sampleRate = ctx.sampleRate;
                const length = Math.floor(sampleRate * duration);
                const impulse = ctx.createBuffer(2, length, sampleRate);
                for (let ch = 0; ch < 2; ch++) {
                    const channelData = impulse.getChannelData(ch);
                    for (let i = 0; i < length; i++) {
                        const env = Math.pow(1 - i / length, decay);
                        channelData[i] = (Math.random() * 2 - 1) * env;
                    }
                }
                return impulse;
            }

            /**
             * Generates a concrete/cinderblock dorm hallway impulse response:
             * Dense early slapback reflections (12ms–95ms) + muffled 1.15s corridor tail
             * with progressive high-frequency air/wall absorption.
             */
            function createDormHallwayImpulse(ctx) {
                const sampleRate = ctx.sampleRate;
                const duration = 1.15;
                const length = Math.floor(sampleRate * duration);
                const impulse = ctx.createBuffer(2, length, sampleRate);

                // Early reflections representing drywall stud cavity + adjacent cinderblock hallway walls
                const earlyTaps = [
                    { time: 0.011, gainL: 0.65, gainR: 0.45 },
                    { time: 0.019, gainL: 0.42, gainR: 0.68 },
                    { time: 0.031, gainL: 0.55, gainR: 0.50 },
                    { time: 0.047, gainL: 0.38, gainR: 0.46 },
                    { time: 0.068, gainL: 0.34, gainR: 0.31 },
                    { time: 0.094, gainL: 0.25, gainR: 0.28 }
                ];

                for (let ch = 0; ch < 2; ch++) {
                    const data = impulse.getChannelData(ch);
                    let lpState = 0;
                    for (let i = 0; i < length; i++) {
                        const t = i / sampleRate;
                        const env = Math.pow(1 - i / length, 3.6);
                        const white = (Math.random() * 2 - 1) * env * 0.45;
                        // One-pole low-pass damping inside the impulse so reflections sound muffled through walls
                        lpState = lpState + 0.14 * (white - lpState);
                        data[i] = lpState;
                    }
                    for (const tap of earlyTaps) {
                        const idx = Math.floor(tap.time * sampleRate);
                        if (idx < length) {
                            data[idx] += (ch === 0 ? tap.gainL : tap.gainR);
                        }
                    }
                }
                return impulse;
            }

            /**
             * Computes continuous acoustic parameters for "Heard from a dorm over" (0% to 100%)
             */
            function getDormAcoustics(dormPct) {
                const d = Math.max(0, Math.min(1, dormPct / 100));
                if (d === 0) {
                    return {
                        cutoffHz: 20000,
                        wallResonanceDb: 0,
                        hallwayWet: 0,
                        directDry: 1,
                        stereoWidth: 1,
                        distanceGain: 1
                    };
                }
                // Exponential sweep from 16,000 Hz down to 255 Hz (two cinderblock/drywall partitions)
                const cutoffHz = 255 * Math.pow(16000 / 255, Math.pow(1 - d, 1.35));
                // Subtle 140 Hz stud/wall panel resonance + low-end bleed boost
                const wallResonanceDb = d * 6.5;
                // Hallway reflection blend rises smoothly as sound travels down the corridor
                const hallwayWet = Math.pow(d, 0.85) * 0.85;
                const directDry = 1 - (d * 0.45);
                // Distance narrows stereo separation toward mono bleed (1.0 -> 0.12)
                const stereoWidth = 1 - (d * 0.88);
                // Distance attenuation (-0 dB at 0% to ~-7.5 dB at 100%, compensated for low-end carry)
                const distanceGain = 1 - (d * 0.56);

                return { cutoffHz, wallResonanceDb, hallwayWet, directDry, stereoWidth, distanceGain };
            }
                // 5. "Heard from a dorm over" Acoustic Wall & Hallway Stage
                const dormAcoustics = getDormAcoustics(state.params.dorm);

                // Two cascaded 12dB/oct low-pass filters = steep 24dB/oct wall transmission roll-off
                const dormWallFilter1 = ctx.createBiquadFilter();
                dormWallFilter1.type = 'lowpass';
                dormWallFilter1.frequency.value = dormAcoustics.cutoffHz;
                dormWallFilter1.Q.value = 0.75;

                const dormWallFilter2 = ctx.createBiquadFilter();
                dormWallFilter2.type = 'lowpass';
                dormWallFilter2.frequency.value = dormAcoustics.cutoffHz;
                dormWallFilter2.Q.value = 0.75;

                // Subtle 140 Hz wall-panel / bass bleed resonance
                const dormWallResonance = ctx.createBiquadFilter();
                dormWallResonance.type = 'peaking';
                dormWallResonance.frequency.value = 140;
                dormWallResonance.Q.value = 1.4;
                dormWallResonance.gain.value = dormAcoustics.wallResonanceDb;

                // Dorm corridor acoustic reflections
                const dormHallwayConvolver = ctx.createConvolver();
                dormHallwayConvolver.buffer = createDormHallwayImpulse(ctx);

                const dormDirectGain = ctx.createGain();
                dormDirectGain.gain.value = dormAcoustics.directDry;

                const dormHallwayGain = ctx.createGain();
                dormHallwayGain.gain.value = dormAcoustics.hallwayWet;

                const dormSumGain = ctx.createGain();
                dormSumGain.gain.value = 1.0;

                // Distance stereo narrowing (cross-bleed L/R as distance increases)
                const dormStereoSplit = ctx.createChannelSplitter(2);
                const dormStereoMerge = ctx.createChannelMerger(2);
                const dormLL = ctx.createGain();
                const dormRR = ctx.createGain();
                const dormLR = ctx.createGain();
                const dormRL = ctx.createGain();

                const keepSide = 0.5 + 0.5 * dormAcoustics.stereoWidth;
                const bleedSide = 0.5 - 0.5 * dormAcoustics.stereoWidth;
                dormLL.gain.value = keepSide;
                dormRR.gain.value = keepSide;
                dormLR.gain.value = bleedSide;
                dormRL.gain.value = bleedSide;

                const dormDistanceGain = ctx.createGain();
                dormDistanceGain.gain.value = dormAcoustics.distanceGain;

                // 6. Master Output Volume Gain (0.0 to 2.0) + Gentle Limiter Guard
                const volumeGain = ctx.createGain();
                volumeGain.gain.value = state.params.volume / 100;

                const limiter = ctx.createDynamicsCompressor();
                limiter.threshold.value = -1.5;
                limiter.knee.value = 6.0;
                limiter.ratio.value = 12.0;
                limiter.attack.value = 0.002;
                limiter.release.value = 0.08;

                // 7. Analyser
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.82;

                // Graph Connections
                bassFilter.connect(shaper);
                shaper.connect(dryGain);
                shaper.connect(convolver);
                convolver.connect(wetGain);

                dryGain.connect(crusherNode);
                wetGain.connect(crusherNode);

                // Crusher -> Dorm Wall Filters -> Direct + Hallway Reflections -> Stereo Narrowing -> Distance Gain -> Output Volume
                crusherNode.connect(dormWallFilter1);
                dormWallFilter1.connect(dormWallFilter2);
                dormWallFilter2.connect(dormWallResonance);

                dormWallResonance.connect(dormDirectGain);
                dormWallResonance.connect(dormHallwayConvolver);
                dormHallwayConvolver.connect(dormHallwayGain);

                dormDirectGain.connect(dormSumGain);
                dormHallwayGain.connect(dormSumGain);

                dormSumGain.connect(dormStereoSplit);
                dormStereoSplit.connect(dormLL, 0);
                dormStereoSplit.connect(dormRL, 0);
                dormStereoSplit.connect(dormRR, 1);
                dormStereoSplit.connect(dormLR, 1);

                dormLL.connect(dormStereoMerge, 0, 0);
                dormLR.connect(dormStereoMerge, 0, 0);
                dormRR.connect(dormStereoMerge, 0, 1);
                dormRL.connect(dormStereoMerge, 0, 1);

                dormStereoMerge.connect(dormDistanceGain);
                dormDistanceGain.connect(volumeGain);
                volumeGain.connect(limiter);
                limiter.connect(analyser);
                analyser.connect(ctx.destination);

                state.nodes = {
                    bassFilter, shaper, dryGain, wetGain, convolver, crusherNode,
                    dormWallFilter1, dormWallFilter2, dormWallResonance,
                    dormHallwayConvolver, dormDirectGain, dormHallwayGain, dormSumGain,
                    dormLL, dormRR, dormLR, dormRL, dormDistanceGain,
                    volumeGain, limiter
                };
                state.analyserNode = analyser;
            }

            function updateRealtimeFX() {
                if (!state.audioCtx || !state.nodes.bassFilter) return;
                const now = state.audioCtx.currentTime;

                state.nodes.volumeGain.gain.setTargetAtTime(state.params.volume / 100, now, 0.015);
                state.nodes.bassFilter.gain.setTargetAtTime(state.params.bassGain, now, 0.015);
                state.nodes.shaper.curve = makeDistortionCurve(state.params.distortion);

                const mix = state.params.reverbMix / 100;
                state.nodes.dryGain.gain.setTargetAtTime(Math.cos(mix * 0.5 * Math.PI), now, 0.015);
                state.nodes.wetGain.gain.setTargetAtTime(Math.sin(mix * 0.5 * Math.PI) * 1.25, now, 0.015);

                // Update "Heard from a dorm over" parameters smoothly
                const dormAcoustics = getDormAcoustics(state.params.dorm);
                state.nodes.dormWallFilter1.frequency.setTargetAtTime(dormAcoustics.cutoffHz, now, 0.02);
                state.nodes.dormWallFilter2.frequency.setTargetAtTime(dormAcoustics.cutoffHz, now, 0.02);
                state.nodes.dormWallResonance.gain.setTargetAtTime(dormAcoustics.wallResonanceDb, now, 0.02);
                state.nodes.dormDirectGain.gain.setTargetAtTime(dormAcoustics.directDry, now, 0.02);
                state.nodes.dormHallwayGain.gain.setTargetAtTime(dormAcoustics.hallwayWet, now, 0.02);
                state.nodes.dormDistanceGain.gain.setTargetAtTime(dormAcoustics.distanceGain, now, 0.02);

                const keepSide = 0.5 + 0.5 * dormAcoustics.stereoWidth;
                const bleedSide = 0.5 - 0.5 * dormAcoustics.stereoWidth;
                state.nodes.dormLL.gain.setTargetAtTime(keepSide, now, 0.02);
                state.nodes.dormRR.gain.setTargetAtTime(keepSide, now, 0.02);
                state.nodes.dormLR.gain.setTargetAtTime(bleedSide, now, 0.02);
                state.nodes.dormRL.gain.setTargetAtTime(bleedSide, now, 0.02);

                if (state.isPlaying && state.sourceNode) {
                    const elapsedReal = now - state.lastSpeedChangeTime;
                    state.accumulatedBufferPos += elapsedReal * state.sourceNode.playbackRate.value;
                    state.lastSpeedChangeTime = now;
                    state.sourceNode.playbackRate.setValueAtTime(state.params.speed, now);
                }
            }

            // --- Minimalist Canvas Visualizer ---
            function resizeCanvas() {
                const rect = el.canvas.parentElement.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                el.canvas.width = rect.width * dpr;
                el.canvas.height = rect.height * dpr;
                canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                if (!state.isRecording && !state.isPlaying) {
                    drawStaticWaveform();
                }
            }

            window.addEventListener('resize', resizeCanvas);

            function drawStaticWaveform(progressRatio = 0) {
                const rect = el.canvas.parentElement.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;
                canvasCtx.clearRect(0, 0, width, height);

                // Crisp hairline center axis
                canvasCtx.strokeStyle = '#F1F1F3';
                canvasCtx.lineWidth = 1;
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, height / 2);
                canvasCtx.lineTo(width, height / 2);
                canvasCtx.stroke();

                if (!state.audioBuffer) return;

                const data = state.audioBuffer.getChannelData(0);
                const step = Math.ceil(data.length / width);
                const amp = height / 2;

                for (let i = 0; i < width; i += 2) {
                    let min = 1.0;
                    let max = -1.0;
                    for (let j = 0; j < step; j++) {
                        const idx = (i * step) + j;
                        if (idx < data.length) {
                            const val = data[idx];
                            if (val < min) min = val;
                            if (val > max) max = val;
                        }
                    }
                    const played = (i / width) <= progressRatio;
                    canvasCtx.fillStyle = played ? '#111111' : '#D4D4D8';
                    const y = (1 + min) * amp;
                    const barHeight = Math.max(1.5, (max - min) * amp);
                    canvasCtx.fillRect(i, y, 1, barHeight);
                }

                // Minimal vertical playhead line
                if (progressRatio > 0 && progressRatio <= 1) {
                    const px = progressRatio * width;
                    canvasCtx.strokeStyle = '#111111';
                    canvasCtx.lineWidth = 1;
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(px, 0);
                    canvasCtx.lineTo(px, height);
                    canvasCtx.stroke();
                }
            }

            function startVisualizerLoop() {
                cancelAnimationFrame(state.animationFrameId);

                const render = () => {
                    const rect = el.canvas.parentElement.getBoundingClientRect();
                    const width = rect.width;
                    const height = rect.height;

                    if (state.isRecording && state.analyserNode) {
                        const bufferLength = state.analyserNode.frequencyBinCount;
                        const dataArray = new Uint8Array(bufferLength);
                        state.analyserNode.getByteTimeDomainData(dataArray);

                        canvasCtx.clearRect(0, 0, width, height);

                        // Center hairline
                        canvasCtx.strokeStyle = '#F1F1F3';
                        canvasCtx.lineWidth = 1;
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(0, height / 2);
                        canvasCtx.lineTo(width, height / 2);
                        canvasCtx.stroke();

                        // Live vermilion red thin-stroke oscilloscope
                        canvasCtx.lineWidth = 1.5;
                        canvasCtx.strokeStyle = '#EF4444';
                        canvasCtx.beginPath();

                        const sliceWidth = width / bufferLength;
                        let x = 0;
                        for (let i = 0; i < bufferLength; i++) {
                            const v = dataArray[i] / 128.0;
                            const y = (v * height) / 2;
                            if (i === 0) canvasCtx.moveTo(x, y);
                            else canvasCtx.lineTo(x, y);
                            x += sliceWidth;
                        }
                        canvasCtx.lineTo(width, height / 2);
                        canvasCtx.stroke();

                        state.animationFrameId = requestAnimationFrame(render);
                    } else if (state.isPlaying && state.audioBuffer && state.analyserNode) {
                        const now = state.audioCtx.currentTime;
                        const currentPos = state.accumulatedBufferPos + (now - state.lastSpeedChangeTime) * state.params.speed;
                        const duration = state.audioBuffer.duration;

                        if (currentPos >= duration && !state.isLooping) {
                            stopPlayback(true);
                            return;
                        }

                        const wrappedPos = state.isLooping ? (currentPos % duration) : Math.min(currentPos, duration);
                        const ratio = wrappedPos / duration;

                        el.scrubber.value = (ratio * 100).toFixed(2);
                        el.currentTimeText.textContent = formatTime(wrappedPos);
                        el.timerDisplay.textContent = formatTime(wrappedPos, true);

                        drawStaticWaveform(ratio);

                        // Live thin-stroke black oscilloscope overlay
                        const bufferLength = state.analyserNode.frequencyBinCount;
                        const dataArray = new Uint8Array(bufferLength);
                        state.analyserNode.getByteTimeDomainData(dataArray);

                        canvasCtx.lineWidth = 1.25;
                        canvasCtx.strokeStyle = '#111111';
                        canvasCtx.beginPath();
                        const sliceWidth = width / bufferLength;
                        let x = 0;
                        for (let i = 0; i < bufferLength; i++) {
                            const v = dataArray[i] / 128.0;
                            const y = (v * height) / 2;
                            if (i === 0) canvasCtx.moveTo(x, y);
                            else canvasCtx.lineTo(x, y);
                            x += sliceWidth;
                        }
                        canvasCtx.stroke();

                        state.animationFrameId = requestAnimationFrame(render);
                    }
                };

                state.animationFrameId = requestAnimationFrame(render);
            }

            // --- Microphone Recording Logic ---
            async function toggleRecording() {
                if (state.isRecording) {
                    stopRecording();
                } else {
                    await startRecording();
                }
            }

            async function startRecording() {
                const ctx = ensureAudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }

                try {
                    stopPlayback();
                    el.toastBanner.classList.add('hidden');
                    hideUploadDiagnostic();

                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        if (!window.isSecureContext) {
                            throw new Error('INSECURE_CONTEXT');
                        }
                        throw new Error('MEDIA_DEVICES_UNAVAILABLE');
                    }

                    let stream;
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    } catch (primaryErr) {
                        if (primaryErr.name === 'NotReadableError' || primaryErr.name === 'AbortError') {
                            await new Promise(r => setTimeout(r, 350));
                            stream = await navigator.mediaDevices.getUserMedia({ audio: {} });
                        } else {
                            throw primaryErr;
                        }
                    }

                    if (ctx.state === 'suspended') {
                        await ctx.resume();
                    }

                    state.mediaStream = stream;
                    state.recordedChunks = [];

                    state.micSourceNode = ctx.createMediaStreamSource(stream);
                    state.micSourceNode.connect(state.analyserNode);

                    const candidateTypes = [
                        'audio/mp4',
                        'audio/webm;codecs=opus',
                        'audio/webm',
                        'audio/ogg;codecs=opus',
                        'audio/ogg'
                    ];
                    let selectedMimeType = '';
                    if (typeof MediaRecorder !== 'undefined' && typeof MediaRecorder.isTypeSupported === 'function') {
                        for (const type of candidateTypes) {
                            if (MediaRecorder.isTypeSupported(type)) {
                                selectedMimeType = type;
                                break;
                            }
                        }
                    }

                    state.mediaRecorder = selectedMimeType
                        ? new MediaRecorder(stream, { mimeType: selectedMimeType })
                        : new MediaRecorder(stream);

                    state.mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            state.recordedChunks.push(e.data);
                        }
                    };

                    state.mediaRecorder.onstop = async () => {
                        const finalType = (state.mediaRecorder && state.mediaRecorder.mimeType) || selectedMimeType || 'audio/mp4';
                        const blob = new Blob(state.recordedChunks, { type: finalType });
                        const track = stream.getAudioTracks()[0];
                        const micLabel = (track && track.label && track.label.toLowerCase().includes('airpod')) ? 'AirPods Memo' : 'Voice Memo';
                        await loadAudioBlob(blob, micLabel, true);
                    };

                    state.mediaRecorder.start(200);
                    state.isRecording = true;
                    state.recStartTime = performance.now();

                    el.canvasOverlayPrompt.classList.add('hidden');
                    el.recordBtn.classList.add('border-studio-rec');
                    el.recIconShape.classList.remove('w-6', 'h-6', 'rounded-full');
                    el.recIconShape.classList.add('w-5', 'h-5', 'rounded-sm');
                    el.trackSourceLabel.textContent = 'Recording...';
                    setStatus('rec', 'Rec');

                    state.recTimerInterval = setInterval(() => {
                        const elapsed = (performance.now() - state.recStartTime) / 1000;
                        el.timerDisplay.textContent = formatTime(elapsed, true);
                    }, 50);

                    startVisualizerLoop();

                } catch (err) {
                    console.warn('Mic access error:', err);
                    const inIframe = window.self !== window.top;
                    let userMsg = 'Microphone access blocked. Check browser Site Settings → Microphone → Allow, or use Load test clip.';

                    if (err.message === 'INSECURE_CONTEXT') {
                        userMsg = 'Mobile browsers require HTTPS for microphone access. Open over HTTPS or use Load test clip.';
                    } else if (inIframe && (err.name === 'NotAllowedError' || err.name === 'SecurityError' || err.message === 'MEDIA_DEVICES_UNAVAILABLE')) {
                        userMsg = 'This embedded preview frame blocks microphone permissions. Open in a full browser tab to record with your phone/AirPods, or tap Load test clip.';
                    } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        userMsg = 'Mic permission denied. In Safari/Chrome, tap the address bar icon → Microphone → Allow, then tap Try Again.';
                    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                        userMsg = 'AirPods/mic is busy or switching audio profile. Wait a second and tap Try Again.';
                    } else if (err.name === 'NotFoundError') {
                        userMsg = 'No microphone detected. Check AirPods Bluetooth connection and tap Try Again.';
                    }

                    showToast(userMsg, true);
                    setStatus('idle', 'No Mic');
                }
            }

            function stopRecording() {
                if (!state.isRecording) return;
                state.isRecording = false;
                clearInterval(state.recTimerInterval);
                cancelAnimationFrame(state.animationFrameId);

                if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
                    state.mediaRecorder.stop();
                }

                if (state.micSourceNode) {
                    state.micSourceNode.disconnect();
                    state.micSourceNode = null;
                }

                if (state.mediaStream) {
                    state.mediaStream.getTracks().forEach(track => track.stop());
                    state.mediaStream = null;
                }

                el.recordBtn.classList.remove('border-studio-rec');
                el.recIconShape.classList.remove('w-5', 'h-5', 'rounded-sm');
                el.recIconShape.classList.add('w-6', 'h-6', 'rounded-full');
            }

            // --- Multi-Stage Audio & Video Loader (.MOV, .MP4, HEVC, WAV, MP3, M4A) ---
            async function loadAudioBlob(blob, labelName, isMicRecording = false) {
                hideUploadDiagnostic();
                const sig = await inspectFileSignature(blob);
                const metaSummary = `File: ${sig.name} · ${sig.sizeFormatted} · MIME: ${sig.reportedMime} · Header: ${sig.container}`;

                if (sig.isEmpty) {
                    setStatus('idle', 'Empty File');
                    showUploadDiagnostic({
                        title: 'Empty or Unsynced File (0 Bytes)',
                        fileMeta: metaSummary,
                        reason: 'The selected file has 0 bytes of data. On iPhone/iPad, this happens when a video or recording is still stored in iCloud and has not finished downloading to your device.',
                        tip: 'Open the video in Apple Photos or Files first to let it download locally, then upload it again.'
                    });
                    return;
                }

                try {
                    const ctx = ensureAudioContext();
                    if (ctx.state === 'suspended') {
                        await ctx.resume();
                    }

                    let decoded = null;

                    // Stage 1: Native Web Audio decodeAudioData (handles WAV, MP3, M4A, AAC, OGG, FLAC, and standard MP4s)
                    try {
                        const arrayBuffer = await blob.arrayBuffer();
                        // Pass a fresh slice to prevent detached buffer issues across browsers
                        decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));
                    } catch (primaryDecodeErr) {
                        // Stage 2: Unmuted offscreen <video> demuxing via captureStream() or MediaElementAudioSourceNode
                        // Essential for iPhone .MOV (ftypqt) and HEVC/H.265 camera roll videos
                        decoded = await extractAudioViaVideoElement(blob, ctx, sig);
                    }

                    if (!decoded || decoded.length === 0) {
                        throw new Error('NO_AUDIO_TRACK');
                    }

                    // Verify audio buffer isn't completely silent due to muted track extraction
                    let peakAmp = 0;
                    const ch0 = decoded.getChannelData(0);
                    const step = Math.max(1, Math.floor(ch0.length / 2000));
                    for (let i = 0; i < ch0.length; i += step) {
                        const abs = Math.abs(ch0[i]);
                        if (abs > peakAmp) peakAmp = abs;
                    }

                    state.audioBuffer = decoded;
                    state.playOffset = 0;
                    state.accumulatedBufferPos = 0;

                    el.trackSourceLabel.textContent = `${labelName} · ${(decoded.sampleRate / 1000).toFixed(1)} kHz`;
                    el.totalTimeText.textContent = formatTime(decoded.duration);
                    el.currentTimeText.textContent = '00:00';
                    el.timerDisplay.textContent = formatTime(decoded.duration, true);
                    el.scrubber.disabled = false;
                    el.scrubber.value = 0;
                    el.playBtn.disabled = false;
                    el.exportBtn.disabled = false;
                    el.canvasOverlayPrompt.classList.add('hidden');

                    setStatus('ready', 'Loaded');
                    drawStaticWaveform(0);

                    if (!isMicRecording && peakAmp === 0) {
                        showToast('Loaded audio, but the track appears completely silent.');
                    }
                } catch (err) {
                    console.error('Media decode failure:', err, sig);
                    setStatus('idle', 'Failed');

                    const code = err && err.message ? err.message : 'UNKNOWN_ERROR';

                    if (sig.isScreenRecording && (code === 'NO_AUDIO_TRACK' || code === 'EMPTY_AUDIO_STREAM')) {
                        showUploadDiagnostic({
                            title: 'iOS Screen Recording Has No Audio Track',
                            fileMeta: metaSummary,
                            reason: 'This iOS Screen Recording (RPReplay) was captured with the Screen Recording Microphone toggled OFF, or the recorded app blocked internal audio capture—leaving a video-only .MOV with 0 audio samples.',
                            tip: 'Swipe down Control Center → long-press the Screen Record button → tap Microphone On before recording, or record a clip with system sound enabled.'
                        });
                    } else if (sig.isScreenRecording) {
                        showUploadDiagnostic({
                            title: 'iOS Screen Recording VFR / QuickTime Stream Issue',
                            fileMeta: metaSummary,
                            reason: `iOS Screen Recordings use Variable Frame Rate (VFR) HEVC QuickTime containers that mobile browsers often fail to demux directly (${code}).`,
                            tip: 'In iPhone Photos, tap Edit on the screen recording, trim 0.1s off the end, and tap Save Video (this re-muxes it into a clean standard MP4/MOV stream).'
                        });
                    } else if (code === 'NO_AUDIO_TRACK' || code === 'EMPTY_AUDIO_STREAM') {
                        showUploadDiagnostic({
                            title: 'No Audio Track Found in Video',
                            fileMeta: metaSummary,
                            reason: 'This video container has 0 playable audio tracks (common with iPhone Screen Recordings recorded with the mic off, Live Photos, or silent social media exports).',
                            tip: 'Check that the video plays sound in your Photos app, or try a video with an active voice/music track.'
                        });
                    } else if (code === 'VIDEO_CODEC_UNSUPPORTED' || sig.isQuickTime) {
                        showUploadDiagnostic({
                            title: 'Unsupported QuickTime / Video Codec',
                            fileMeta: metaSummary,
                            reason: 'Your browser could not demux this QuickTime .MOV / HEVC video stream directly. iOS "High Efficiency" (HEVC + spatial/multichannel audio) .MOV containers often reject direct browser audio extraction.',
                            tip: 'In iPhone Photos, tap Edit → trim 0.1s and save as a new clip, or share the video to Apple Voice Memos / Files as .m4a and upload.'
                        });
                    } else if (code === 'AUTOPLAY_OR_STALL_TIMEOUT') {
                        showUploadDiagnostic({
                            title: 'Browser Media Extraction Blocked or Timed Out',
                            fileMeta: metaSummary,
                            reason: 'Your mobile browser paused offscreen video playback during audio extraction (often triggered by Low Power Mode or background tab throttling).',
                            tip: 'Disable Low Power Mode, keep the screen active during upload, or upload a shorter clip.'
                        });
                    } else {
                        showUploadDiagnostic({
                            title: 'Could Not Decode Audio / Video File',
                            fileMeta: metaSummary,
                            reason: `Browser media decoder rejected this file (${code}). The container or audio codec may be corrupted or DRM-protected.`,
                            tip: 'Try converting the file to .M4A, .MP3, or .WAV, or record directly using the red microphone button.'
                        });
                    }
                }
            }

            // Stage 2 Extractor: Unmuted <video> element with captureStream() primary + MediaElementSource fallback
            function extractAudioViaVideoElement(blob, ctx, sig) {
                return new Promise((resolve, reject) => {
                    // Ensure MIME type hint is provided if iOS Files gave empty string ""
                    let typedBlob = blob;
                    if (!blob.type && sig.isQuickTime) {
                        typedBlob = new Blob([blob], { type: 'video/quicktime' });
                    } else if (!blob.type && sig.isVideo) {
                        typedBlob = new Blob([blob], { type: 'video/mp4' });
                    }

                    const objectUrl = URL.createObjectURL(typedBlob);
                    const videoEl = document.createElement('video');
                    videoEl.src = objectUrl;
                    videoEl.preload = 'auto';
                    videoEl.playsInline = true;
                    videoEl.setAttribute('playsinline', '');
                    videoEl.setAttribute('webkit-playsinline', '');
                    videoEl.crossOrigin = 'anonymous';
                    // CRITICAL: Never set videoEl.muted = true; muted videos output zeroed samples in captureStream/MediaElementSource on iOS Safari
                    videoEl.muted = false;
                    videoEl.volume = 1.0;

                    let cleanedUp = false;
                    let stallTimer = null;

                    const cleanup = () => {
                        if (cleanedUp) return;
                        cleanedUp = true;
                        clearTimeout(stallTimer);
                        try { videoEl.pause(); } catch (e) {}
                        videoEl.removeAttribute('src');
                        videoEl.load();
                        URL.revokeObjectURL(objectUrl);
                    };

                    // Safety timeout so mobile browsers never hang indefinitely
                    stallTimer = setTimeout(() => {
                        cleanup();
                        reject(new Error('AUTOPLAY_OR_STALL_TIMEOUT'));
                    }, 25000);

                    videoEl.onerror = () => {
                        cleanup();
                        reject(new Error(sig.isQuickTime ? 'VIDEO_CODEC_UNSUPPORTED' : 'VIDEO_LOAD_ERROR'));
                    };

                    videoEl.onloadedmetadata = async () => {
                        const duration = videoEl.duration;
                        if (!isFinite(duration) || duration <= 0) {
                            cleanup();
                            reject(new Error('NO_AUDIO_TRACK'));
                            return;
                        }

                        // Detect explicit 0-audio-track metadata where browser exposes it
                        if (typeof videoEl.mozHasAudio === 'boolean' && !videoEl.mozHasAudio) {
                            cleanup();
                            reject(new Error('NO_AUDIO_TRACK'));
                            return;
                        }
                        if (videoEl.audioTracks && videoEl.audioTracks.length === 0) {
                            cleanup();
                            reject(new Error('NO_AUDIO_TRACK'));
                            return;
                        }

                        setStatus('play', 'Extracting');
                        el.trackSourceLabel.textContent = `Extracting (${Math.ceil(duration)}s)...`;

                        try {
                            let sourceNode = null;
                            let capturedStream = null;

                            // Prefer captureStream() / mozCaptureStream() when available (decouples from speaker output cleanly)
                            if (typeof videoEl.captureStream === 'function') {
                                capturedStream = videoEl.captureStream();
                            } else if (typeof videoEl.mozCaptureStream === 'function') {
                                capturedStream = videoEl.mozCaptureStream();
                            }

                            if (capturedStream) {
                                const audioTracks = capturedStream.getAudioTracks();
                                if (audioTracks.length === 0) {
                                    // Fallback to MediaElementSource in case captureStream populates audio tracks on play
                                    capturedStream = null;
                                } else {
                                    sourceNode = ctx.createMediaStreamSource(capturedStream);
                                }
                            }

                            if (!sourceNode) {
                                sourceNode = ctx.createMediaElementSource(videoEl);
                            }

                            const captureNode = ctx.createScriptProcessor(4096, 2, 2);
                            const silentOut = ctx.createGain();
                            silentOut.gain.value = 0; // Keep Web Audio pull graph active while muting speaker output

                            const chunksL = [];
                            const chunksR = [];
                            let totalSamples = 0;

                            captureNode.onaudioprocess = (e) => {
                                if (videoEl.paused || videoEl.ended) return;
                                const inL = e.inputBuffer.getChannelData(0);
                                const inR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : inL;
                                chunksL.push(new Float32Array(inL));
                                chunksR.push(new Float32Array(inR));
                                totalSamples += inL.length;
                            };

                            sourceNode.connect(captureNode);
                            captureNode.connect(silentOut);
                            silentOut.connect(ctx.destination);

                            const finalizeExtraction = () => {
                                try {
                                    sourceNode.disconnect();
                                    captureNode.disconnect();
                                    silentOut.disconnect();
                                } catch (e) {}

                                if (typeof videoEl.webkitAudioDecodedByteCount === 'number' && videoEl.webkitAudioDecodedByteCount === 0 && totalSamples === 0) {
                                    cleanup();
                                    reject(new Error('NO_AUDIO_TRACK'));
                                    return;
                                }

                                if (totalSamples === 0) {
                                    cleanup();
                                    reject(new Error('EMPTY_AUDIO_STREAM'));
                                    return;
                                }

                                const outBuffer = ctx.createBuffer(2, totalSamples, ctx.sampleRate);
                                const outL = outBuffer.getChannelData(0);
                                const outR = outBuffer.getChannelData(1);
                                let offset = 0;
                                for (let i = 0; i < chunksL.length; i++) {
                                    outL.set(chunksL[i], offset);
                                    outR.set(chunksR[i], offset);
                                    offset += chunksL[i].length;
                                }

                                cleanup();
                                resolve(outBuffer);
                            };

                            videoEl.onended = finalizeExtraction;

                            // Start playback at 1.0x so every audio frame is decoded cleanly without pitch/drop artifacts
                            videoEl.playbackRate = 1.0;
                            await videoEl.play();
                        } catch (playErr) {
                            cleanup();
                            if (playErr && playErr.name === 'NotAllowedError') {
                                reject(new Error('AUTOPLAY_OR_STALL_TIMEOUT'));
                            } else {
                                reject(new Error(sig.isQuickTime ? 'VIDEO_CODEC_UNSUPPORTED' : 'VIDEO_DECODE_FAILED'));
                            }
                        }
                    };
                });
            }

            function generateTestSynthBuffer() {
                stopRecording();
                stopPlayback();
                hideUploadDiagnostic();
                const ctx = ensureAudioContext();
                const sampleRate = ctx.sampleRate;
                const duration = 4.0;
                const length = Math.floor(sampleRate * duration);
                const buffer = ctx.createBuffer(2, length, sampleRate);

                const notes = [220, 261.63, 329.63, 440, 392.00, 329.63, 261.63, 196.00];

                for (let ch = 0; ch < 2; ch++) {
                    const data = buffer.getChannelData(ch);
                    for (let i = 0; i < length; i++) {
                        const t = i / sampleRate;
                        const beatIdx = Math.floor(t * 2) % notes.length;
                        const localT = (t * 2) % 1;
                        const freq = notes[beatIdx];

                        const env = Math.exp(-localT * 4.5) * Math.min(1, localT * 40);
                        const sub = Math.sin(2 * Math.PI * (freq * 0.5) * t) * 0.45;
                        const lead = ((2 * ((t * freq) % 1)) - 1) * 0.25;
                        const formant = Math.sin(2 * Math.PI * (freq * 3) * t + Math.sin(t * 14) * 1.5) * 0.2;

                        const pan = ch === 0 ? 0.95 : 1.05;
                        data[i] = (sub + lead + formant) * env * pan * 0.85;
                    }
                }

                state.audioBuffer = buffer;
                state.playOffset = 0;
                state.accumulatedBufferPos = 0;

                el.trackSourceLabel.textContent = `Test Clip · ${(sampleRate / 1000).toFixed(1)} kHz`;
                el.totalTimeText.textContent = formatTime(duration);
                el.currentTimeText.textContent = '00:00';
                el.timerDisplay.textContent = formatTime(duration, true);
                el.scrubber.disabled = false;
                el.scrubber.value = 0;
                el.playBtn.disabled = false;
                el.exportBtn.disabled = false;
                el.canvasOverlayPrompt.classList.add('hidden');

                setStatus('ready', 'Loaded');
                drawStaticWaveform(0);
            }

            // --- Playback Engine ---
            function togglePlayback() {
                if (!state.audioBuffer) return;
                if (state.isPlaying) {
                    pausePlayback();
                } else {
                    startPlayback();
                }
            }

            function startPlayback() {
                if (!state.audioBuffer) return;
                const ctx = ensureAudioContext();

                if (state.sourceNode) {
                    try { state.sourceNode.stop(); state.sourceNode.disconnect(); } catch (e) {}
                }

                const source = ctx.createBufferSource();
                source.buffer = state.audioBuffer;
                source.loop = state.isLooping;
                source.playbackRate.value = state.params.speed;

                source.connect(state.nodes.bassFilter);

                if (state.playOffset >= state.audioBuffer.duration) {
                    state.playOffset = 0;
                }

                source.start(0, state.playOffset);
                state.sourceNode = source;
                state.isPlaying = true;
                state.lastSpeedChangeTime = ctx.currentTime;
                state.accumulatedBufferPos = state.playOffset;

                updateRealtimeFX();

                el.playBtn.classList.remove('bg-white', 'text-studio-ink', 'border-studio-border');
                el.playBtn.classList.add('bg-studio-ink', 'text-white', 'border-studio-ink');
                el.playBtnText.textContent = 'Pause';
                el.playIcon.setAttribute('data-lucide', 'pause');
                lucide.createIcons();
                setStatus('play', 'Playing');

                startVisualizerLoop();
            }

            function pausePlayback() {
                if (!state.isPlaying) return;
                const ctx = state.audioCtx;
                const elapsed = (ctx.currentTime - state.lastSpeedChangeTime) * state.params.speed;
                state.playOffset = (state.accumulatedBufferPos + elapsed) % state.audioBuffer.duration;

                stopPlayback(false);
            }

            function stopPlayback(resetToZero = true) {
                state.isPlaying = false;
                cancelAnimationFrame(state.animationFrameId);

                if (state.sourceNode) {
                    try {
                        state.sourceNode.stop();
                        state.sourceNode.disconnect();
                    } catch (e) {}
                    state.sourceNode = null;
                }

                if (resetToZero) {
                    state.playOffset = 0;
                    state.accumulatedBufferPos = 0;
                    el.scrubber.value = 0;
                    el.currentTimeText.textContent = '00:00';
                    if (state.audioBuffer) {
                        el.timerDisplay.textContent = formatTime(state.audioBuffer.duration, true);
                        drawStaticWaveform(0);
                    }
                } else if (state.audioBuffer) {
                    drawStaticWaveform(state.playOffset / state.audioBuffer.duration);
                }

                el.playBtn.classList.remove('bg-studio-ink', 'text-white', 'border-studio-ink');
